[project]
name = "krb-student-asist"
version = "0.1.0"
description = "RAG-асистент для студентів СумДУ по нормативних документах"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.0",
    "markitdown[all]>=0.1.0",
    "ollama>=0.4.0",
    "groq>=0.5.0",
    "chonkie>=1.5.5",
    "elasticsearch>=9.3.0",
    "aiohttp>=3.13.3",
    "python-multipart>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"



[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]

